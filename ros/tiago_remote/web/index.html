<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TIAGo Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171c; --card:#1e2128; --text:#f2f3f5; --sec:#8a909c; --sep:#2b2f38;
    --accent:#ff7a1a; --onAccent:#15171c; --green:#34d399; --red:#ff4d5e; --amber:#fbbf24; --fill:#262a32;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text); overflow:hidden; font:17px/1.3 "Space Grotesk", system-ui, sans-serif}
  .app{height:100dvh; max-width:440px; margin:0 auto; display:flex; flex-direction:column;
       padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom)); gap:12px}
  button{font-family:inherit}

  .top{display:flex; align-items:flex-end; justify-content:space-between; padding-top:6px}
  h1{font-size:34px; font-weight:700; letter-spacing:-.02em; margin:0}
  .status{display:flex; flex-direction:column; align-items:flex-end; gap:3px; font-size:13px; color:var(--sec)}
  .status span{display:inline-flex; align-items:center; gap:6px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green)}

  .seg{display:grid; grid-template-columns:repeat(2,1fr); background:var(--fill); border-radius:9px; padding:2px; position:relative}
  .seg button{position:relative; z-index:1; border:0; background:none; font-weight:600; font-size:13px;
              color:var(--text); padding:9px 0; border-radius:7px; cursor:pointer}
  .seg button.on{color:var(--onAccent)}
  .seg .thumb{position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px)/2); background:var(--accent);
              border-radius:7px; transition:transform .25s cubic-bezier(.3,.7,.4,1)}
  .seg.small button{padding:7px 0; font-size:12px}
  .seg.small .thumb{background:var(--text)}

  .view{display:none; flex:1; flex-direction:column; gap:10px; min-height:0}
  .view.active{display:flex}
  .card{background:var(--card); border-radius:16px; border:1px solid var(--sep)}

  /* drive (static in this mockup) */
  .pad{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px}
  .jwrap{position:relative; padding:22px 52px}
  .jl{position:absolute; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--sec)}
  .jl.f{top:0; left:50%; transform:translateX(-50%)} .jl.b{bottom:0; left:50%; transform:translateX(-50%)}
  .jl.l{left:0; top:50%; transform:translateY(-50%)} .jl.r{right:0; top:50%; transform:translateY(-50%)}
  .joy{width:min(58vw,32dvh,240px); aspect-ratio:1; border-radius:50%; background:var(--fill); position:relative; touch-action:none; cursor:grab}
  .joy::before{content:""; position:absolute; inset:22%; border-radius:50%; border:1px solid var(--sep)}
  .knob{position:absolute; left:50%; top:50%; width:34%; height:34%; transform:translate(-50%,-50%); border-radius:50%;
        background:var(--accent); box-shadow:0 4px 18px rgba(255,122,26,.45); transition:transform .18s ease}
  .knob.drag{transition:none}
  .vals{font-size:15px; color:var(--sec)} .vals b{color:var(--text)}

  /* ---------- CONVERSATION ---------- */
  .turn{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .live{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--green)}
  .live i{width:8px; height:8px; border-radius:50%; background:var(--green); animation:p 1.4s infinite}
  .live.listen{color:#7cc4ff} .live.listen i{background:#7cc4ff}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}100%{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
  .sentence{font-size:24px; font-weight:700; line-height:1.15; min-height:1.2em}
  .sentence.empty{color:var(--sec); font-weight:500; font-size:18px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; min-height:30px}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; letter-spacing:.04em;
        padding:5px 6px 5px 11px; border-radius:999px; background:var(--fill); color:var(--sec)}
  .chip.new{background:rgba(255,122,26,.16); color:var(--accent)}
  .chip button{border:0; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.08); color:inherit;
               font-size:13px; line-height:1; cursor:pointer}
  .actions{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:8px}
  .btn{border:0; border-radius:12px; padding:12px; font-weight:600; font-size:15px; cursor:pointer;
       background:rgba(255,122,26,.14); color:var(--accent)}
  .btn.primary{background:var(--accent); color:var(--onAccent)}
  .btn:disabled{opacity:.35; cursor:not-allowed}

  .hist{flex:1; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px}
  .hist h3{margin:0 0 2px; font-size:12px; letter-spacing:.1em; color:var(--sec); font-weight:600}
  .msg{max-width:82%; padding:8px 12px; border-radius:14px; font-size:15px; line-height:1.3}
  .msg small{display:block; font-size:11px; font-weight:600; letter-spacing:.06em; opacity:.75; margin-bottom:2px}
  .msg.you{align-self:flex-end; background:rgba(255,122,26,.16); color:#ffd2b0; border-bottom-right-radius:4px}
  .msg.them{align-self:flex-start; background:var(--fill); border-bottom-left-radius:4px}

  .settings{display:flex; gap:8px}
  .set{flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px;
       font-size:14px; color:var(--sec); cursor:pointer}
  .switch{width:40px; height:24px; border-radius:999px; background:var(--fill); position:relative; transition:background .2s; flex:none}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s}
  .switch.on{background:var(--accent)} .switch.on::after{transform:translateX(16px)}

  .stop{flex:none; border:0; border-radius:14px; background:rgba(255,77,94,.14); color:var(--red); font-weight:600; font-size:16px; padding:13px; cursor:pointer}
  .toast{position:fixed; left:50%; top:16px; transform:translate(-50%,-80px); background:var(--card); border:1px solid var(--sep);
         border-radius:999px; padding:9px 16px; font-size:14px; font-weight:600; transition:transform .3s; z-index:9}
  .toast.show{transform:translate(-50%,0)}

  .row{display:flex; align-items:center; gap:12px; padding:13px 16px}
  .row label{flex:none}
  .row .val{margin-left:auto; color:var(--sec); font-variant-numeric:tabular-nums; min-width:70px; text-align:right}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:2px;
       background:linear-gradient(90deg, var(--accent) var(--p,50%), var(--fill) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:#fff; border:0; box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .dot.off{background:var(--sec)} .dot.warn{background:var(--amber)}
  .offline .view, .offline .seg{opacity:.4; pointer-events:none}
  .set.disabled{opacity:.4; pointer-events:none}
  .live.idle{color:var(--sec)} .live.idle i{background:var(--sec); animation:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <h1>TIAGo</h1>
    <div class="status">
      <span><i class="dot off" id="connDot"></i><span id="connText">Connecting…</span></span>
      <span><i class="dot off" id="trDot"></i><span id="trText">Translator offline</span></span>
    </div>
  </div>

  <div class="seg" id="tabs">
    <span class="thumb" id="tabThumb"></span>
    <button data-tab="drive" class="on">Drive</button>
    <button data-tab="conv">Conversation</button>
  </div>

  <!-- DRIVE -->
  <section class="view active" id="view-drive">
    <div class="card pad">
      <div class="jwrap"><span class="jl f">FORWARD</span><span class="jl b">BACKWARD</span><span class="jl l">LEFT</span><span class="jl r">RIGHT</span><div class="joy" id="joy"><div class="knob" id="knob"></div></div></div>
      <div class="vals">Speed <b id="lin">0.00</b> m/s · Turn <b id="ang">0.00</b> rad/s</div>
    </div>
    <div class="card">
      <div class="row"><label>Max speed</label><input type="range" id="speed" min="0.05" max="1" step="0.05" value="0.5"><span class="val" id="speedVal">0.50 m/s</span></div>
    </div>
  </section>

  <!-- CONVERSATION -->
  <section class="view" id="view-conv">
    <div class="seg small" id="modes">
      <span class="thumb" id="modeThumb"></span>
      <button data-mode="talk" class="on">Talk · signs → voice</button>
      <button data-mode="listen">Listen · voice → text</button>
    </div>

    <div class="card turn">
      <div class="live idle" id="live"><i></i><span id="liveText">Translator offline</span></div>
      <div class="sentence empty" id="sentence">Start signvoice.py on the robot</div>
      <div class="chips" id="chips"></div>
      <div class="actions" id="actions">
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="clear">Clear</button>
        <button class="btn primary" id="speak">Speak</button>
      </div>
    </div>

    <div class="card hist" id="hist"><h3>HISTORY</h3></div>

    <div class="settings">
      <div class="card set" id="llm"><span>LLM sentences</span><i class="switch" id="llmSw"></i></div>
      <div class="card set" id="fs"><span>Robot full screen</span><i class="switch" id="fsSw"></i></div>
    </div>
  </section>

  <button class="stop" id="stop">Stop</button>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== TIAGo Remote — phone UI <-> tiago_remote server (WebSocket) ===== */
const $=id=>document.getElementById(id);
let ws=null, tab='drive', conv=null, online=false;

function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(x._h);x._h=setTimeout(()=>x.classList.remove('show'),1500);}
function seg(id,thumb,attr,val){ [...$(id).querySelectorAll('button')].forEach((b,i)=>{ const on=b.dataset[attr]===val;
  b.classList.toggle('on',on); if(on) $(thumb).style.transform=`translateX(${i*100}%)`; }); }

/* ---------- connection ---------- */
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function setOnline(on){
  $('app').classList.toggle('offline',!on);
  $('connDot').className='dot'+(on?'':' off');
  if(!on){ $('connText').textContent='Offline — reconnecting…'; releaseJoy(false); }
}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>setOnline(true);
  ws.onclose=()=>{ setOnline(false); setTimeout(connect,1000); };
  ws.onmessage=e=>{ const m=JSON.parse(e.data);
    if(m.type==='conv'){ online=m.online; conv=m.state; renderConv(); }
    else if(m.type==='toast') toast(m.text);
    else if(m.type==='pong') $('connText').textContent='Connected · '+Math.round(performance.now()-m.t)+' ms'; };
}
setInterval(()=>send({type:'ping',t:performance.now()}),1000);
connect();

/* ---------- tabs ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; seg('tabs','tabThumb','tab',tab);
  $('view-drive').classList.toggle('active',tab==='drive'); $('view-conv').classList.toggle('active',tab==='conv');
  if(tab!=='drive') releaseJoy(); });
seg('tabs','tabThumb','tab','drive');

/* ---------- drive ---------- */
const speed=$('speed');
function paint(){const p=(speed.value-speed.min)/(speed.max-speed.min)*100; speed.style.setProperty('--p',p+'%');
  $('speedVal').textContent=(+speed.value).toFixed(2)+' m/s';}
speed.oninput=paint; paint();
const MAX_ANG=1.5; // rad/s at full deflection
const joy=$('joy'),knob=$('knob'); let drag=false, cmd={lin:0,ang:0}, sender=null;
function mv(e){const r=joy.getBoundingClientRect(),R=r.width*.33;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
  const d=Math.hypot(dx,dy); if(d>R){dx*=R/d;dy*=R/d;}
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  cmd.lin=(-dy/R)*speed.value; cmd.ang=(-dx/R)*MAX_ANG;
  $('lin').textContent=cmd.lin.toFixed(2); $('ang').textContent=cmd.ang.toFixed(2);}
function releaseJoy(notify=true){
  drag=false; knob.classList.remove('drag'); knob.style.transform='translate(-50%,-50%)';
  cmd={lin:0,ang:0}; $('lin').textContent='0.00'; $('ang').textContent='0.00';
  clearInterval(sender); sender=null; if(notify) send({type:'cmd',lin:0,ang:0});
}
joy.onpointerdown=e=>{ drag=true; knob.classList.add('drag'); joy.setPointerCapture(e.pointerId); mv(e);
  send({type:'cmd',...cmd}); clearInterval(sender); sender=setInterval(()=>send({type:'cmd',...cmd}),100); };
joy.onpointermove=e=>{ if(drag) mv(e); };
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,()=>{ if(drag) releaseJoy(); }));
document.addEventListener('visibilitychange',()=>{ if(document.hidden && drag) releaseJoy(); });

/* ---------- conversation (state comes from signvoice.py) ---------- */
const act=(action,extra={})=>send({type:'action',action,...extra});
function renderConv(){
  const c=conv||{}, ok=online && !!conv, talk=(c.mode||'talk')==='talk';
  $('trDot').className='dot'+(ok?'':' off'); $('trText').textContent=ok?'Translator online':'Translator offline';
  seg('modes','modeThumb','mode',talk?'talk':'listen');
  // status line
  const live=$('live');
  if(!ok){ live.className='live idle'; $('liveText').textContent='Translator offline'; }
  else if(c.speaking){ live.className='live'; $('liveText').textContent='Speaking…'; }
  else if(talk){ live.className='live'; $('liveText').textContent='Reading signs'; }
  else { live.className='live listen'; $('liveText').textContent=c.listen_status||'Listening…'; }
  // sentence / heard text
  const s=$('sentence'); let txt, empty;
  if(!ok){ txt='Start signvoice.py on the robot'; empty=true; }
  else if(talk){ txt=c.sentence||'Sign in front of the robot…'; empty=!c.sentence; }
  else { txt=c.heard||'Speak near the robot…'; empty=!c.heard; }
  s.textContent=txt; s.classList.toggle('empty',empty);
  // chips with x
  const ch=$('chips'); ch.innerHTML=''; ch.style.display=talk?'':'none';
  (c.tokens||[]).forEach((t,i,a)=>{ const e=document.createElement('span'); e.className='chip'+(i===a.length-1?' new':'');
    e.append(t); const x=document.createElement('button'); x.textContent='×'; x.setAttribute('aria-label','remove '+t);
    x.onclick=()=>act('del',{arg:i}); e.append(x); ch.append(e); });
  // buttons
  const n=(c.tokens||[]).length;
  $('undo').style.display=talk?'':'none'; $('speak').style.display=talk?'':'none';
  $('actions').style.gridTemplateColumns=talk?'1fr 1fr 1.4fr':'1fr';
  $('undo').disabled=$('speak').disabled=!ok||!n; $('clear').disabled=!ok||(talk?!n:!c.heard);
  // history
  const h=$('hist'), atBottom=h.scrollHeight-h.scrollTop-h.clientHeight<40;
  h.innerHTML='<h3>HISTORY</h3>';
  (c.history||[]).forEach(([who,t])=>{ const m=document.createElement('div'); m.className='msg '+(who==='you'?'you':'them');
    const sm=document.createElement('small'); sm.textContent=who==='you'?'YOU':'THEM'; m.append(sm,t); h.append(m); });
  if(atBottom) h.scrollTop=h.scrollHeight;
  // settings
  $('llmSw').classList.toggle('on',!!c.llm); $('llm').classList.toggle('disabled',!ok||!c.llm_available);
  $('fsSw').classList.toggle('on',!!c.fullscreen); $('fs').classList.toggle('disabled',!ok);
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>act('mode',{value:b.dataset.mode}));
$('undo').onclick=()=>act('undo'); $('clear').onclick=()=>act('clear'); $('speak').onclick=()=>act('speak');
$('llm').onclick=()=>act('llm',{value:!(conv&&conv.llm)});
$('fs').onclick=()=>act('fullscreen',{value:!(conv&&conv.fullscreen)});
renderConv();

/* ---------- stop ---------- */
$('stop').onclick=()=>{ releaseJoy(false); send({type:'stop'}); toast('Robot stopped'); };
</script>
</body>
</html>
